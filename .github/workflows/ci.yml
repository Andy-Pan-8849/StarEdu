name: ci

on:
  push:
  pull_request:

jobs:
  ai-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-module
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: starit
          POSTGRES_PASSWORD: starit
          POSTGRES_DB: starit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starit -d starit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STARIT_DATABASE_URL: postgresql+psycopg://ai_app:starit-app@localhost:5432/starit
      STARIT_MIGRATION_DATABASE_URL: postgresql+psycopg://starit:starit@localhost:5432/starit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages apps eval
      - name: Evaluation questions agree with the documents
        run: python3 sample-data/tools/check_qa_facts.py
      - name: Migrations run on an empty database
        run: uv run alembic upgrade head
      - name: Start Keycloak (demo realm is imported on first start)
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml up -d --wait keycloak
      - name: Tests (unit and integration)
        run: uv run pytest
      - name: Keycloak logs (on failure)
        if: failure()
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml logs keycloak --tail 100

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-module/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ai-module/web/.nvmrc
          cache: npm
          cache-dependency-path: ai-module/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  business-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-module
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: starit
          POSTGRES_PASSWORD: starit
          POSTGRES_DB: starit_biz
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U starit -d starit_biz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # 应用用低权限账号 biz_app（受行级安全约束，由迁移创建）；迁移用库所有者
      DATABASE_URL: postgresql://biz_app:starit-app@localhost:5433/starit_biz?schema=biz
      MIGRATION_DATABASE_URL: postgresql://starit:starit@localhost:5433/starit_biz?schema=biz
      REDIS_URL: redis://localhost:6380/0
      KEYCLOAK_URL: http://localhost:8180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: business-module/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: business-module/.nvmrc
          cache: pnpm
          cache-dependency-path: business-module/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - name: Migrations run on an empty database
        run: pnpm migrate
      - name: Start Keycloak, Mailpit and the object store
        run: docker compose --env-file .env.example -f deploy/compose/biz.yaml up -d --wait keycloak mailpit objectstore
      - name: Tests (unit, integration and cross-tenant leak scan; real Postgres, Redis, Keycloak)
        run: pnpm test
      - name: Keycloak realm template smoke test
        run: pnpm smoke
      - name: Provision the two demo tenants (twice, to prove it can be repeated)
        run: pnpm seed && pnpm seed
      - name: Keycloak logs (on failure)
        if: failure()
        run: docker compose --env-file .env.example -f deploy/compose/biz.yaml logs keycloak --tail 100
