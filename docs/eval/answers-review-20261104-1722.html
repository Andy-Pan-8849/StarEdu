<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>答案评测人工抽查</title><style>
:root{--bg:#fff;--fg:#1b1f24;--mut:#667085;--line:#d8dee6;--card:#f6f8fa;--ok:#1a7f37;--bad:#cf222e;--acc:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e6e8eb;--mut:#9aa3ad;--line:#2d333b;--card:#1c2128;--ok:#3fb950;--bad:#f85149;--acc:#818cf8}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:14px 0}
.k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.btns button{font:inherit;padding:6px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);cursor:pointer;margin-right:8px}
.btns button.on.p{background:var(--ok);color:#fff;border-color:var(--ok)}.btns button.on.f{background:var(--bad);color:#fff;border-color:var(--bad)}
textarea{width:100%;box-sizing:border-box;margin-top:8px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
.pill{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line)}
.auto-pass{color:var(--ok)}.auto-fail{color:var(--bad)}
button.main{font:inherit;padding:6px 14px;border-radius:6px;border:0;background:var(--acc);color:#fff;cursor:pointer}
</style></head><body>
<div class="bar"><strong>答案评测人工抽查</strong><span id="prog"></span><span id="agree"></span><button class="main" id="dl">下载结果 CSV</button></div>
<main><p style="color:var(--mut)">逐题对照「参考答案」和「助手回答」，判断回答是否<b>包含参考答案的关键事实且没有错误</b>。先别看机器判分（点开后才显示），避免被带偏。进度自动保存在本浏览器。</p><div id="list"></div></main>
<script>
const ROWS=[{"id": "DOC-01", "role": "staff", "type": "single", "question": "How much is the referral bonus for referring an instructor who gets hired?", "reference": "CNY 3,000, paid with payroll after the referred employee completes 90 days (HR-REC-001 v2.1).", "answer": "The referral bonus is CNY 3,000 for an instructor hire. It is paid with payroll after the referred employee completes 90 days of employment. HR staff and the hiring manager for the position are not eligible. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-03", "role": "staff", "type": "single", "question": "How long is the probation period for an instructor, and for a manager?", "reference": "3 months for instructors and non-management staff; 6 months for managers (M1 and above).", "answer": "An instructor’s probation period is 3 months. A manager’s probation period is 6 months (for managers at levels M1 and above). Probation may be extended once by up to 1 month if the manager and HR agree more time is needed. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-04", "role": "staff", "type": "single", "question": "How much does the company pay for an external certification?", "reference": "80 percent of the fee, up to CNY 5,000 per calendar year, with prior manager approval and a 12-month service commitment.", "answer": "The company pays 80 percent of the exam or course fee, up to CNY 5,000 per calendar year, for certifications related to the instructor’s teaching area. The manager must approve it before registration, and the subsidy is paid after the employee passes and submits the certificate and receipt. University degrees and language courses are not covered. [1]", "end_state": "answered/None", "auto_verdict": "fail", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-10", "role": "staff", "type": "single", "question": "What are the performance rating categories and their target shares?", "reference": "A 10%, B+ 25%, B 50%, C 15%.", "answer": "The performance rating categories and target shares are: A — Outstanding, 10 percent; B+ — Exceeds expectations, 25 percent; B — Meets expectations, 50 percent; C — Below expectations, 15 percent. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-108", "role": "staff", "type": "access", "question": "How much commission do admissions advisors earn?", "reference": "Must refuse: the information is restricted to roles the asker does not have.", "answer": "Based on the documents available to your account, I could not find information to answer that. Please check the wording, or ask the relevant team.", "end_state": "not_found/no_relevant_documents", "auto_verdict": "pass", "method": "refusal", "human_verdict": "", "human_note": ""}, {"id": "DOC-21", "role": "staff", "type": "single", "question": "What are the pay structure percentages for instructors?", "reference": "70 percent fixed base and 30 percent performance pay.", "answer": "Instructors’ pay structure is 70 percent of target monthly pay as fixed base and 30 percent as performance pay. Performance pay is paid quarterly according to the rating: A pays 120 percent of target performance pay, B+ pays 110 percent, B pays 100 percent, and C pays 70 percent. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-27", "role": "student", "type": "single", "question": "Which Node.js version and package manager are used in the TypeScript course?", "reference": "Node.js 22 LTS and pnpm 9, with the registry https://npm.starit.example/.", "answer": "The TypeScript course uses Node.js 22 LTS and pnpm 9.[1]", "end_state": "answered/None", "auto_verdict": "fail", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-30", "role": "student", "type": "keyword", "question": "What does ERR-PORTAL-429 mean?", "reference": "The monthly download quota (5 GB) is used up; wait for the 1st of the month or ask the instructor for extra quota.", "answer": "ERR-PORTAL-429 means your download quota has been used up. Wait until the 1st of the month, when the monthly quota resets, or ask your instructor for an extra quota. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-42", "role": "staff", "type": "multi", "question": "An expense happened on 15 January and was submitted on 20 February. Is it accepted?", "reference": "It was submitted after 36 days, more than 30 but within 90: needs Finance Manager approval; it is not automatically rejected.", "answer": "No, not without Finance Manager approval. The claim was submitted 36 calendar days after the expense date, which is after the 30-day deadline; claims submitted after 30 days need Finance Manager approval. It is not older than 90 days, so the 90-day rejection rule does not apply. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-48", "role": "finance", "type": "access", "question": "What is the annual bonus formula and the rating multipliers?", "reference": "Monthly base x rating multiplier (A 1.5, B+ 1.2, B 1.0, C 0) x company factor (0.5 to 1.5), paid with the February payroll.", "answer": "Annual bonus = monthly base salary × rating multiplier × company factor. [1] The rating multipliers are: A = 1.5; B+ = 1.2; B = 1.0; C = 0. [1] The company factor is set by the Board in January and lies between 0.5 and 1.5. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-49", "role": "finance", "type": "access", "question": "What commission do admissions advisors earn?", "reference": "3 percent of net tuition collected, paid after the 14-day refund window; clawed back in full if the student withdraws within 30 days after the program starts.", "answer": "Admissions advisors earn 3 percent of the net tuition collected for each student they enroll. Net tuition excludes refunds and discounts. The commission is paid in the month after the student’s 14-day refund window closes. If the student withdraws within 30 days after the program starts, the commission is clawed back in full from the next payroll. Team leads earn an extra 0.5 percent on their team’s net tuition. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "judge", "human_verdict": "", "human_note": ""}, {"id": "DOC-50", "role": "student", "type": "access", "question": "How do I report a lost company laptop?", "reference": "Must refuse: the staff device policy is not for students.", "answer": "Based on the documents available to your account, I could not find information to answer that. Please check the wording, or ask the relevant team.", "end_state": "no_permission/restricted_document", "auto_verdict": "pass", "method": "refusal", "human_verdict": "", "human_note": ""}, {"id": "DOC-58", "role": "staff", "type": "keyword", "question": "Which email address answers invoice questions?", "reference": "finance-help@starit.example (Finance Shared Service, business days).", "answer": "Invoice questions are answered by Finance Shared Service at finance-help@starit.example on business days. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "facts", "human_verdict": "", "human_note": ""}, {"id": "DOC-59", "role": "student", "type": "keyword", "question": "What is the name of the campus Wi-Fi network for students?", "reference": "StarIT-Student", "answer": "The campus Wi-Fi network for students is called `StarIT-Student`. Sign in with your student ID. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "facts", "human_verdict": "", "human_note": ""}, {"id": "DOC-64", "role": "student", "type": "keyword", "question": "How much is the deposit for a loaner laptop, and for how long can I keep it?", "reference": "CNY 500 refundable deposit; up to 14 days.", "answer": "The refundable deposit is CNY 500, and you can keep the loaner laptop for up to 14 days. Late returns cost CNY 20 per day. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "facts", "human_verdict": "", "human_note": ""}, {"id": "DOC-70", "role": "staff", "type": "paraphrase", "question": "How much more do non-exempt staff get for working a Sunday?", "reference": "2 times the hourly rate on weekends.", "answer": "Non-exempt staff receive 2 times their hourly rate for weekend overtime, so Sunday work is paid at double the hourly rate. Overtime must be approved in advance. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "facts", "human_verdict": "", "human_note": ""}, {"id": "DOC-76", "role": "staff", "type": "version", "question": "How long was the teaching demo for instructor candidates under version 1.0 of the recruitment policy?", "reference": "20 minutes under version 1.0 (30 minutes under the current version 2.1).", "answer": "Under version 1.0, instructor candidates gave a teaching demo of 20 minutes. Version 1.0 is superseded by version 2.1, which is active now.[1][2]", "end_state": "answered/None", "auto_verdict": "pass", "method": "facts", "human_verdict": "", "human_note": ""}, {"id": "DOC-80", "role": "staff", "type": "version", "question": "In which period was version 1.0 of the recruitment policy in force?", "reference": "From 2024-03-01 to 2025-12-31.", "answer": "Version 1.0 was in force from 2024-03-01 to 2025-12-31. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "facts", "human_verdict": "", "human_note": ""}, {"id": "DOC-81", "role": "staff", "type": "version", "question": "Within how many days after the final interview must an offer be sent now, and previously?", "reference": "Within 5 business days under version 2.1; within 10 business days under version 1.0.", "answer": "Now, the offer must be sent within 5 business days after the final interview [1]. Previously, it had to be sent within 10 business days after the final interview; version 1.0 is superseded by version 2.1 [2][1].", "end_state": "answered/None", "auto_verdict": "pass", "method": "facts", "human_verdict": "", "human_note": ""}, {"id": "DOC-84", "role": "staff", "type": "unanswerable", "question": "How much is the parking allowance at the Beijing campus?", "reference": "Not covered by the documents; the assistant should say so.", "answer": "Based on the documents available to your account, I could not find information to answer that. Please check the wording, or ask the relevant team.", "end_state": "not_found/no_relevant_documents", "auto_verdict": "pass", "method": "refusal", "human_verdict": "", "human_note": ""}, {"id": "DOC-88", "role": "student", "type": "unanswerable", "question": "Which database does the Data Engineering bootcamp use?", "reference": "Not covered by the documents; the assistant should say so.", "answer": "Based on the documents available to your account, I could not find information to answer that. Please check the wording, or ask the relevant team.", "end_state": "no_permission/restricted_document", "auto_verdict": "pass", "method": "refusal", "human_verdict": "", "human_note": ""}, {"id": "DOC-89", "role": "student", "type": "unanswerable", "question": "What is the password of the lab Wi-Fi?", "reference": "Not covered by the documents; the assistant should say so.", "answer": "Based on the documents available to your account, I could not find information to answer that. Please check the wording, or ask the relevant team.", "end_state": "not_found/no_relevant_documents", "auto_verdict": "pass", "method": "refusal", "human_verdict": "", "human_note": ""}, {"id": "DOC-95", "role": "manager", "type": "single", "question": "How many days in advance must an instructor ask for leave on a day with classes?", "reference": "At least 14 days in advance, with a qualified substitute and the department head's approval.", "answer": "An instructor must submit the leave request at least 14 days in advance for a day with scheduled classes. Emergency sick leave is exempt from this rule; the instructor must inform the department head before 7:30 on the day, and the department head arranges cover. [1]", "end_state": "answered/None", "auto_verdict": "pass", "method": "facts", "human_verdict": "", "human_note": ""}];const KEY="review-answers-20261104-1722";
let st={};try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(){document.getElementById("list").innerHTML=ROWS.map((r,i)=>{const s=st[r.id]||{};return `<div class="card"><b>${r.id}</b> <span class="pill">${esc(r.type)}</span> <span class="pill">${esc(r.role)}</span> <span class="pill">${esc(r.method)}</span>
<div class="k">问题</div>${esc(r.question)}<div class="k">参考答案</div>${esc(r.reference)}<div class="k">助手回答</div>${esc(r.answer)}
<div class="btns" style="margin-top:10px"><button class="p ${s.v==="pass"?"on":""}" data-i="${i}" data-v="pass">通过</button><button class="f ${s.v==="fail"?"on":""}" data-i="${i}" data-v="fail">不通过</button>
<details style="display:inline"><summary style="display:inline;cursor:pointer;color:var(--mut)">机器判分</summary> <span class="auto-${r.auto_verdict}">${esc(r.auto_verdict)}</span></details></div>
<textarea rows="1" placeholder="备注（可选）" data-n="${i}">${esc(s.n||"")}</textarea></div>`}).join("");
const done=ROWS.filter(r=>st[r.id]&&st[r.id].v).length;document.getElementById("prog").textContent=`已完成 ${done}/${ROWS.length}`;
const both=ROWS.filter(r=>st[r.id]&&st[r.id].v);const same=both.filter(r=>st[r.id].v===r.auto_verdict).length;
document.getElementById("agree").textContent=done?`与机器判分一致 ${same}/${done}`:""}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(!b)return;const r=ROWS[b.dataset.i];st[r.id]={...(st[r.id]||{}),v:b.dataset.v};save();render()});
document.addEventListener("change",e=>{const t=e.target.closest("textarea[data-n]");if(!t)return;const r=ROWS[t.dataset.n];st[r.id]={...(st[r.id]||{}),n:t.value};save()});
document.getElementById("dl").onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const cols=["id","role","type","question","reference","answer","end_state","auto_verdict","method","human_verdict","human_note"];
const out=[cols.join(",")].concat(ROWS.map(r=>cols.map(c=>c==="human_verdict"?q((st[r.id]||{}).v||""):c==="human_note"?q((st[r.id]||{}).n||""):q(r[c])).join(","))).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/csv"}));a.download="answers-20261104-1722-reviewed.csv";a.click()};
render();
</script></body></html>
