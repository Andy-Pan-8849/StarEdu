[project]
name = "starit-worker"
version = "0.0.0"
description = "StarEdu AI module ETL worker (stub until M3)"
requires-python = ">=3.12"
dependencies = ["starit-core"]

[project.scripts]
starit-worker = "starit_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starit_worker"]
