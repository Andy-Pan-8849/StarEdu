# 文件：apps/api/pyproject.toml
# 作用：API 服务的包定义与依赖（FastAPI 等）；依赖 starit-core。

[project]
name = "starit-api"
version = "0.0.0"
description = "StarEdu AI module HTTP API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "starit-core",
    "uvicorn>=0.30",
    "python-multipart>=0.0.20",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starit_api"]
