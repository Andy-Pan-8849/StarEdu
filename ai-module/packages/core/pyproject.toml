[project]
name = "starit-core"
version = "0.0.0"
description = "Shared library: configuration, database access and logging"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.35",
    "langgraph>=1.0",
    "litellm>=1.50",
    "markdown-it-py>=3.0",
    "mcp>=2.3,<3",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "pydantic-settings>=2.5",
    "python-docx>=1.1",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "sqlglot>=30",
    "tiktoken>=0.8",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starit_core"]
