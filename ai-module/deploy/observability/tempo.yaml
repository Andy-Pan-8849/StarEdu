# 文件：deploy/observability/tempo.yaml
# 作用：Tempo（链路存储）配置：单进程、本地磁盘存储，接收 Collector 发来的 OTLP/gRPC。

# Single-binary Tempo with local storage (Tempo 3.x monolithic mode).
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
