# 文件：deploy/observability/otel-collector.yaml
# 作用：OTel Collector 配置：接收三个服务的 OTLP/HTTP，链路转给 Tempo，指标开放给 Prometheus
#   抓取。
# memory_limiter 防止 Collector 占用过多内存，batch 批量发送。

# Receives OTLP/HTTP from api, worker and mcp-server; traces go to Tempo, metrics are exposed for
# Prometheus to scrape. No logs pipeline: logs stay JSON on stdout (with trace_id and run_id).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
