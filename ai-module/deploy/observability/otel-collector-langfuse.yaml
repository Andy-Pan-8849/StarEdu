# 文件：deploy/observability/otel-collector-langfuse.yaml
# 作用：在原 Collector 配置之上，再把链路转发给 Langfuse（OTLP/HTTP，Langfuse 不支持 gRPC）。
# 认证头由 basicauth 扩展根据公钥/私钥现场编码，仓库里不存编码后的凭据。

# The same Collector, with a second trace destination: Langfuse (OTLP over HTTP; gRPC is not
# supported there). Used by deploy/compose/langfuse.yaml in place of otel-collector.yaml.
extensions:
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    auth:
      authenticator: basicauth/langfuse
    headers:
      x-langfuse-ingestion-version: "4"
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
