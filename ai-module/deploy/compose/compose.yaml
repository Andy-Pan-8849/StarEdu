name: starit-ai

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starit}
      POSTGRES_DB: ${POSTGRES_DB:-starit}
    ports:
      - "${STARIT_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${STARIT_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. The official MinIO images are no longer published,
  # so this uses the MinIO-compatible community fork. The code only uses the S3 API.
  objectstore:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-starit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-starit-secret}
    ports:
      - "${STARIT_S3_PORT:-9000}:9000"
      - "${STARIT_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Identity provider. Demo realm (roles, test accounts) is imported on first start.
  # start-dev with the built-in file database is for local use only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:${STARIT_KEYCLOAK_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${STARIT_KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/starit-realm.json:/opt/keycloak/data/import/starit-realm.json:ro
      - keycloakdata:/opt/keycloak/data
    healthcheck:
      # The image has no curl; use bash's /dev/tcp against the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Applies the database migrations as the owner, then exits. The API waits for it.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args:
        APP: api
    command: ["alembic", "upgrade", "head"]
    environment:
      STARIT_MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-starit}:${POSTGRES_PASSWORD:-starit}@postgres:5432/${POSTGRES_DB:-starit}
      STARIT_APP_DB_PASSWORD: ${STARIT_APP_DB_PASSWORD:-starit-app}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Processes ingestion jobs from the Postgres queue.
  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args:
        APP: worker
    command: ["starit-worker"]
    restart: unless-stopped
    environment:
      STARIT_ENV: ${STARIT_ENV:-dev}
      STARIT_LOG_LEVEL: ${STARIT_LOG_LEVEL:-INFO}
      STARIT_DATABASE_URL: postgresql+psycopg://ai_app:${STARIT_APP_DB_PASSWORD:-starit-app}@postgres:5432/${POSTGRES_DB:-starit}
      STARIT_S3_ENDPOINT_URL: http://objectstore:9000
      STARIT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-starit}
      STARIT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-starit-secret}
      STARIT_S3_BUCKET: ${STARIT_S3_BUCKET:-starit-documents}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      STARIT_LLM_GATEWAY: litellm_proxy
      STARIT_LLM_GATEWAY_URL: http://litellm:4000
      STARIT_LLM_GATEWAY_KEY: ${LITELLM_MASTER_KEY:-sk-starit-local-dev}
    depends_on:
      litellm:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:v1.106.6
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-starit-local-dev}
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${STARIT_LITELLM_PORT:-4100}:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mcp-server:
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args:
        APP: mcp-server
    command: ["starit-mcp-server"]
    restart: unless-stopped
    environment:
      STARIT_ENV: ${STARIT_ENV:-dev}
      STARIT_LOG_LEVEL: ${STARIT_LOG_LEVEL:-INFO}
      STARIT_DATABASE_URL: postgresql+psycopg://ai_app:${STARIT_APP_DB_PASSWORD:-starit-app}@postgres:5432/${POSTGRES_DB:-starit}
      STARIT_OIDC_ISSUER: http://localhost:${STARIT_KEYCLOAK_PORT:-8080}/realms/starit
      STARIT_OIDC_JWKS_URL: http://keycloak:8080/realms/starit/protocol/openid-connect/certs
      STARIT_MCP_PORT: 8100
      STARIT_MCP_URL: http://localhost:${STARIT_MCP_PORT:-8100}/mcp
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      STARIT_LLM_GATEWAY: litellm_proxy
      STARIT_LLM_GATEWAY_URL: http://litellm:4000
      STARIT_LLM_GATEWAY_KEY: ${LITELLM_MASTER_KEY:-sk-starit-local-dev}
    ports:
      - "${STARIT_MCP_PORT:-8100}:8100"
    depends_on:
      litellm:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args:
        APP: api
    command: ["uvicorn", "starit_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      STARIT_ENV: ${STARIT_ENV:-dev}
      STARIT_LOG_LEVEL: ${STARIT_LOG_LEVEL:-INFO}
      STARIT_DATABASE_URL: postgresql+psycopg://ai_app:${STARIT_APP_DB_PASSWORD:-starit-app}@postgres:5432/${POSTGRES_DB:-starit}
      STARIT_REDIS_URL: redis://redis:6379/0
      STARIT_S3_ENDPOINT_URL: http://objectstore:9000
      STARIT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-starit}
      STARIT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-starit-secret}
      STARIT_S3_BUCKET: ${STARIT_S3_BUCKET:-starit-documents}
      # Tokens are issued for localhost; keys are fetched over the Compose network.
      STARIT_OIDC_ISSUER: http://localhost:${STARIT_KEYCLOAK_PORT:-8080}/realms/starit
      STARIT_OIDC_JWKS_URL: http://keycloak:8080/realms/starit/protocol/openid-connect/certs
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      STARIT_LLM_GATEWAY: litellm_proxy
      STARIT_LLM_GATEWAY_URL: http://litellm:4000
      STARIT_LLM_GATEWAY_KEY: ${LITELLM_MASTER_KEY:-sk-starit-local-dev}
      STARIT_RATE_LIMIT_CHAT_PER_MINUTE: ${STARIT_RATE_LIMIT_CHAT_PER_MINUTE:-20}
      STARIT_DATA_TOOLS_BACKEND: mcp
      STARIT_CORS_ORIGINS: http://localhost:${STARIT_WEB_PORT:-3000}
      STARIT_MCP_URL: http://mcp-server:8100/mcp
    ports:
      - "${STARIT_API_PORT:-8000}:8000"
    depends_on:
      litellm:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${STARIT_API_PORT:-8000}
        NEXT_PUBLIC_OIDC_AUTHORITY: http://localhost:${STARIT_KEYCLOAK_PORT:-8080}/realms/starit
        NEXT_PUBLIC_OIDC_CLIENT_ID: starit-web
    ports:
      - "${STARIT_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  objectdata:
  keycloakdata:
