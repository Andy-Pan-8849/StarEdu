# 文件：deploy/compose/observability.yaml
# 作用：可选的链路与指标栈（make up-obs 叠加启动）：OTel Collector 收数据 -> Tempo 存链路、
# Prometheus 存指标 -> Grafana 看板。同时给 api、worker、mcp-server 打开 OpenTelemetry。

# Optional: traces and metrics. Start with `make up-obs`; the core stack works without it.
# It adds the OTel Collector, Tempo (traces), Prometheus (metrics) and Grafana, and turns
# OpenTelemetry on in api, worker and mcp-server.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${STARIT_OTLP_PORT:-4318}:4318"
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped
    volumes:
      - ../observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "${STARIT_TEMPO_PORT:-3200}:3200"

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    restart: unless-stopped
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${STARIT_PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${STARIT_GRAFANA_PORT:-3300}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    environment: &telemetry
      STARIT_OTEL_ENABLED: "true"
      STARIT_OTEL_ENDPOINT: http://otel-collector:4318
  worker:
    environment: *telemetry
  mcp-server:
    environment: *telemetry

volumes:
  tempodata:
  promdata:
  grafanadata:
