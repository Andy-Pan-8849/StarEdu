# 文件：pyproject.toml（ai-module 根）
# 作用：uv 工作区的根配置。工作区成员：packages/core（共享核心）、apps/api、apps/worker、
# apps/mcp-server、eval。同时放全仓库共用的工具配置：ruff（代码风格，行宽 100）、
# mypy（严格类型检查）、pytest（测试发现与异步模式）。
# 根本身不是一个可安装的包（package=false），只负责把成员组织在一起并统一依赖版本（uv.lock）。

[project]
name = "starit-ai-module"
version = "0.0.0"
description = "StarEdu AI module: enterprise knowledge assistant and agents (uv workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker", "apps/mcp-server", "eval"]

[tool.uv.sources]
starit-core = { workspace = true }
starit-api = { workspace = true }
starit-worker = { workspace = true }
starit-mcp-server = { workspace = true }
starit-eval = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["sample-data", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test data and SQL strings are clearer on one line.
"**/tests/**" = ["E501"]
# Report and console text is prose; wrapping it hurts readability.
"eval/src/starit_eval/report.py" = ["E501"]
"eval/src/starit_eval/cli.py" = ["E501"]
"eval/src/starit_eval/agent_check.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is written as Depends(...) in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "eval"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the Compose services (Postgres) to be running"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/core/src", "apps/api/src", "apps/worker/src", "apps/mcp-server/src", "eval/src"]
explicit_package_bases = true

exclude = ["migrations/", "sample-data/", "web/"]

[[tool.mypy.overrides]]
# These libraries ship no type information.
module = ["boto3", "botocore", "botocore.*", "pdfplumber", "pdfplumber.*"]
ignore_missing_imports = true
