# 文件：alembic.ini
# 作用：Alembic（数据库迁移工具）的配置：迁移脚本放在 migrations/ 目录。连接地址不在这里，
#   来自环境变量（见 migrations/env.py）。

[alembic]
script_location = migrations
prepend_sys_path = .
# The database URL comes from STARIT_DATABASE_URL (see migrations/env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
