# 文件：eval/pyproject.toml
# 作用：评测工具的包定义与依赖；提供命令 starit-eval。

[project]
name = "starit-eval"
version = "0.0.0"
description = "Evaluation runner for the StarEdu AI module (retrieval quality, permission regression)"
requires-python = ">=3.12"
dependencies = ["starit-core"]

[project.scripts]
starit-eval = "starit_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starit_eval"]
